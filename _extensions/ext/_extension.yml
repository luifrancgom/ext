title: Extending html template
author: Luis Francisco Gomez Lopez
version: 1.0.0
quarto-required: ">=1.11.0"
contributes:
  formats:
    html:
      filters:
        - filters/by-role.lua # builds by-role from by-author (mirrors by-affiliation)
      theme:
        - styles/custom.scss # concatenated with doc/base theme, compiled together
      template-partials:
        - partials/title-block.html
        - partials/title-metadata.html
        - partials/_title-meta-author.html
        - partials/_title-meta-grid.html
        - partials/_title-meta-role.html
      label:
        roles: roles # default $label.roles$ heading text, overridable in doc metadata